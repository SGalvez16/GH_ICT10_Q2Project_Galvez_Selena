<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Data Types in Python</title>
    <title>Student Grade Calculator</title>
    
    <style>
        body {
            background-color: #002147;
            font-family: "EB Garamond", sans-serif;
            text-align: left;
            margin: 0;
            padding: 0;
        }
        div {
            background-color: #B9D9EB;
            color: black;
            border: solid ;
            font-size: 23px;
            text-align: center;
            width: 900px;
            height: 600px;
            justify-content: center;
            border-radius: 20px;
            margin: 0 auto;
            margin-bottom: 10px;

        }

        .div3{
            background-color: #B9D9EB;
            font-size: 24px;
            margin-bottom: 5px;
            text-align: center;
            width: 200px;
            height: 50px;
            border-radius: 10px;
        }

        nav {
            background-color: #002147;
            display: flex;
            justify-content: center;
            padding: 15px 0;
            gap: 30px;
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 20px;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        nav a:hover {
            background-color: #F0F8FF;
            color: black;
        }

        .img-logo{
            display: block;
            margin: 0 auto;
            height: 100px;
            width: 100px;
        }

    </style>

</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="grade.html" aria-current="page">Grade Calculator</a>
        <a href="clubs.html">Clubs</a>
    </nav>
    <div class="container">
        <img src="logo.png" class="img-logo" alt="logo">
        <h1>Student Grade Calculator</h1>
        <form>

            <p>Given name:</p>
            <input type="text" id="text1" placeholder="Enter your first name"><br>
            <p>Surname:</p>
            <input type="text" id="text2" placeholder="Enter your last name"><br>

            <h4><strong>Enter report card results:</strong></h4>
            <input type="text" id="text3" placeholder="Science">
            <input type="text" id="text4" placeholder="English">
            <input type="text" id="text5" placeholder="Math">
            <input type="text" id="text6" placeholder="ICT">
            <input type="text" id="text7" placeholder="PE">
            <input type="text" id="text8" placeholder="Filipino">
            <input type="button" py-click="calculate_gwa(event)" value="Calculate GWA"><br>

        </form>
    </div>
        <div class="div3" id="output"></div>
    </div>

<py-script src="main.py"></py-script>

</body>
</html>
